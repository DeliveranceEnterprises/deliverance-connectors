# RobotCamera definitions — Ezviz Connector
# Account: Deliverance (rnLasGAxn5CP7bj32)
#
# Mirrors the shape of "Cam 1 RS 293" (camera-0-rs-1):
#   spec:
#     enabled: true
#     height: 240
#     label: cam
#     outputEncoding: rgb8
#     quality: 30
#     rate: 1
#     rosTopic: '0'
#     transitive:
#       bitrate: 100
#       deviceId: <internal>
#       source: rtsp://admin:****@<ip>:554/...
#       type: rtsp
#     width: 380
#
# Ezviz H6C exposes a local RTSP stream when "Local Service Settings → RTSP"
# is enabled in the Ezviz app. The default URL is:
#   rtsp://admin:<verification_code>@<camera_lan_ip>:554/h264_stream
# The 6-character verification code is printed on the device label.

apiVersion: v0.1
kind: RobotCamera
metadata:
  id: '0'
  scope: robot/rnLasGAxn5CP7bj32/ezviz-cam-1
spec:
  enabled: true
  label: cam
  outputEncoding: rgb8
  width: 380
  height: 240
  quality: 30
  rate: 1
  rosTopic: '0'
  transitive:
    type: rtsp
    bitrate: 100
    # H6C BG4293922 — RTSP path discovered via ONVIF GetStreamUri.
    # The 6-char password is the camera verification code (device label).
    # Main stream: /Streaming/Channels/101 (2304x1296)
    # Sub stream:  /Streaming/Channels/102 (lower res, less bandwidth)
    source: rtsp://admin:BMPSCX@192.168.3.79:554/Streaming/Channels/102
---
apiVersion: v0.1
kind: RobotCamera
metadata:
  id: '0'
  scope: robot/rnLasGAxn5CP7bj32/ezviz-cam-2
spec:
  enabled: true
  label: cam
  outputEncoding: rgb8
  width: 380
  height: 240
  quality: 30
  rate: 1
  rosTopic: '0'
  transitive:
    type: rtsp
    bitrate: 100
    # H6C BG4293947 — LAN IP 192.168.3.81, verification code YXDJXF.
    source: rtsp://admin:YXDJXF@192.168.3.81:554/Streaming/Channels/102
