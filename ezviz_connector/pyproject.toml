[project]
name = "ezviz-connector"
version = "0.1.0"
description = "InOrbit Edge connector for Ezviz cameras"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Deliverance Enterprises", email = "eduardo.munera@deliverance.enterprises" },
]
maintainers = [
    { name = "Deliverance Enterprises", email = "eduardo.munera@deliverance.enterprises" },
]
keywords = ["inorbit", "connector", "edge-connector", "camera", "ezviz"]
classifiers = [
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "inorbit-connector[system-stats]~=2.2.0",
    "pyezvizapi>=1.0.4,<2.0",
    "tenacity~=9.0",
    "pydantic-settings~=2.7",
]

[project.urls]
Homepage = "https://github.com/deliverance-enterprises/ezviz-connector"
Repository = "https://github.com/deliverance-enterprises/ezviz-connector"
Issues = "https://github.com/deliverance-enterprises/ezviz-connector/issues"

[project.optional-dependencies]
dev = [
    "pytest~=8.4",
    "pytest-asyncio~=1.2",
    "ruff>=0.14.7",
    "colorlog~=6.10.1",
]

[project.scripts]
ezviz-connector = "ezviz_connector.ezviz_connector:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ezviz_connector"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
