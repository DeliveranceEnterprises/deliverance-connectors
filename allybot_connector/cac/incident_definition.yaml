# IncidentDefinitions for Allybot. IDs match StatusDefinition IDs for implicit
# linking — InOrbit fires an incident on each WARNING/ERROR transition.

apiVersion: v0.1
kind: IncidentDefinition
metadata:
  id: allybot-ws-connected
  scope: tag/rnLasGAxn5CP7bj32/StdZGa32GmBLReFr
spec:
  label: Allybot WebSocket Disconnected
  error:
    notificationChannels:
      - app
    severity: SEV 1
  ok:
    notificationChannels: []
---
apiVersion: v0.1
kind: IncidentDefinition
metadata:
  id: allybot-battery
  scope: tag/rnLasGAxn5CP7bj32/StdZGa32GmBLReFr
spec:
  label: Allybot Low Battery
  warning:
    notificationChannels:
      - app
    severity: SEV 2
  error:
    notificationChannels:
      - app
    severity: SEV 1
  ok:
    notificationChannels: []
