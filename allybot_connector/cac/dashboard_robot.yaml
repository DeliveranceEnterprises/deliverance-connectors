# Global Robot dashboard — adds an Allybot-specific section conditioned on the
# Allybot hardware tag. Only robots with that tag will see this section.
# All existing sections of d-Robot-lLybVa are preserved as-is.
#
# WARNING: this file contains the full dashboard spec including sections for
# other robots. Do not remove other robots' sections when applying.
#
# Apply with:
#   sed -e "s/<ACCOUNT_ID>/rnLasGAxn5CP7bj32/g" \
#       cac/dashboard_robot.yaml > /tmp/robot.yaml
#   yes | inorbit apply -f /tmp/robot.yaml

