# ActionDefinition objects — Allybot Connector
# Account: Deliverance (rnLasGAxn5CP7bj32) | Tag: Allybot (StdZGa32GmBLReFr)
#
# Cleaning area actions: one action per named area, task_id baked in.
# Add more areas by duplicating the allybot-clean-* pattern below.

apiVersion: v0.1
kind: ActionDefinition
metadata:
  id: allybot-clean-espaitec
  scope: tag/rnLasGAxn5CP7bj32/StdZGa32GmBLReFr
spec:
  type: RunScript
  label: "Clean: Espaitec"
  group: Cleaning
  description: Start the Espaitec cleaning task. Robot returns to dock when done.
  confirmation:
    required: false
  lock: false
  arguments:
    - name: filename
      type: string
      value: start_task
    - name: task_id
      type: string
      value: "ae3178a170b0f97b40e783e7f9dad747"
    - name: reach_charge_point
      type: string
      value: "true"
---
apiVersion: v0.1
kind: ActionDefinition
metadata:
  id: allybot-clean-hotel-hospital
  scope: tag/rnLasGAxn5CP7bj32/StdZGa32GmBLReFr
spec:
  type: RunScript
  label: "Demo Clean A"
  group: Demo
  # Repurposed 2026-09-07 for Use Case 1 (Factory/Warehouse): Allybot stands in
  # for the not-yet-integrated Viggo SC50 (industrial floor cleaning) per
  # Eduardo's own InOrbit_RobotSpaceEU_UseCases.pdf, which labels these two
  # zones "Clean A -- Aisle/Shift Prep" and "Clean B -- Spill Event" -- same
  # underlying Hotel_Hospital zone/task, just relabeled for the Factory demo
  # narrative, not a new physical area.
  description: Start the Clean A (Aisle / Shift Prep) cleaning task for the Factory/Warehouse demo. Robot returns to dock when done.
  confirmation:
    required: false
  lock: false
  arguments:
    - name: filename
      type: string
      value: start_task
    - name: task_id
      type: string
      value: "dc6ed8db2848365649754077f57fb281"
    - name: reach_charge_point
      type: string
      value: "true"
---
apiVersion: v0.1
kind: ActionDefinition
metadata:
  id: allybot-clean-shopping-retail
  scope: tag/rnLasGAxn5CP7bj32/StdZGa32GmBLReFr
spec:
  type: RunScript
  label: "Demo Clean B"
  group: Demo
  # Task name in the Allybot app is " Shopping_Retail" (leading space, shortened) --
  # the plan/zone itself is named "ShoppingMall_Retail". Repurposed 2026-09-07
  # for Use Case 1 (Factory/Warehouse), same reasoning as allybot-clean-hotel-hospital
  # above -- "Clean B -- Spill Event" per Eduardo's PDF, same underlying zone/task.
  description: Start the Clean B (Spill Event) cleaning task for the Factory/Warehouse demo. Robot returns to dock when done.
  confirmation:
    required: false
  lock: false
  arguments:
    - name: filename
      type: string
      value: start_task
    - name: task_id
      type: string
      value: "d18cba6929bb0b43ce667c4f4196eee7"
    - name: reach_charge_point
      type: string
      value: "true"
---
