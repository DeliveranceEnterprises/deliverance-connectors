# Global Navigation dashboard — adds Autoxing-specific section.
# The existing sections are preserved as-is.

apiVersion: v0.1
kind: DashboardDefinition
metadata:
  id: d-Navigation-Z8YZAb
  scope: account/rnLasGAxn5CP7bj32
spec:
  label: Navigation
  order: 3
  sections:
  - label: Robot Navigation
    scope: navigation
    widgets:
    - label: Navigation
      layout:
        grid: 12
        height: 2
      type: navigation
    withControlWidget: true
  - label: Details
    scope: robot
    widgets:
    - config:
        dataSources:
        - id: xlXPmDo3Z3GMwSTM
          label: Battery
          type: gauge
          unit: '%'
      label: Vitals
      layout:
        chroma: true
        grid: 4
        height: 1
      type: vitals
    - label: Audit Log
      layout:
        chroma: true
        grid: 4
        height: 1
      type: auditLog
    - label: Modes and Tags
      layout:
        chroma: true
        grid: 4
        height: 1
      type: tagsAndModes
    withControlWidget: false
  - conditional:
      tags:
      - StdZGa32GmBLReFr
    label: Allybot
    scope: robot
    widgets:
    - config:
        actionIds:
        - allybot-clean-espaitec
        - allybot-pause-task
        - allybot-resume-task
        - allybot-stop-task
        bigButtons: true
        expanded: true
      label: Allybot Actions
      layout:
        chroma: true
        grid: 6
        height: 1
      type: actionsWidget
    - label: Mission
      layout:
        chroma: true
        grid: 6
        height: 1
      type: missionTracker
    withControlWidget: false
  - conditional:
      tags:
      - 8gMbOLofiZYK0uKx
    label: Autoxing
    scope: robot
    widgets:
    - config:
        actionIds:
        - autoxing-go-to-a
        - autoxing-go-to-b
        - autoxing-go-to-home
        - autoxing-go-home
        - autoxing-cancel-task
        bigButtons: true
        expanded: true
      label: Autoxing Actions
      layout:
        chroma: true
        grid: 6
        height: 1
      type: actionsWidget
    - label: Mission
      layout:
        chroma: true
        grid: 6
        height: 1
      type: missionTracker
    withControlWidget: false
