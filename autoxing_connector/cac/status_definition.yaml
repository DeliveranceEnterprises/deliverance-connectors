# StatusDefinition objects for Autoxing connector.
# battery publishes 0–1 float → thresholds in 0–1.
# loc_quality publishes 0–100 int, scale: 0.01 → post-scale 0–1.
# Boolean fields use EQUALS false → ERROR.

apiVersion: v0.1
kind: StatusDefinition
metadata:
  id: autoxing-battery
  scope: tag/rnLasGAxn5CP7bj32/8gMbOLofiZYK0uKx
spec:
  rules:
    - function: BELOW
      params:
        - 0.15
      status: ERROR
    - function: BELOW
      params:
        - 0.30
      status: WARNING
---
apiVersion: v0.1
kind: StatusDefinition
metadata:
  id: autoxing-loc-quality
  scope: tag/rnLasGAxn5CP7bj32/8gMbOLofiZYK0uKx
spec:
  rules:
    - function: BELOW
      params:
        - 0.50
      status: ERROR
    - function: BELOW
      params:
        - 0.80
      status: WARNING
---
apiVersion: v0.1
kind: StatusDefinition
metadata:
  id: autoxing-is-emergency-stop
  scope: tag/rnLasGAxn5CP7bj32/8gMbOLofiZYK0uKx
spec:
  rules:
    - function: EQUALS
      params:
        - true
      status: ERROR
---
apiVersion: v0.1
kind: StatusDefinition
metadata:
  id: autoxing-has-obstruction
  scope: tag/rnLasGAxn5CP7bj32/8gMbOLofiZYK0uKx
spec:
  rules:
    - function: EQUALS
      params:
        - true
      status: WARNING
---
apiVersion: v0.1
kind: StatusDefinition
metadata:
  id: autoxing-api-connected
  scope: tag/rnLasGAxn5CP7bj32/8gMbOLofiZYK0uKx
spec:
  rules:
    - function: EQUALS
      params:
        - false
      status: ERROR
