# MissionTracking -- WDC (Agent SDK, robot 223623373)
# Makes InOrbit's interpretation of the bridge's mission_tracking JSON
# explicit instead of relying on automatic inference. src/wdc_bridge_node.py
# publishes the standard mission_tracking key-value with state values
# "Executing", "Completed", "Aborted" (no "Canceled" -- the local API's
# stopAction has no way to distinguish "canceled by us" from "arrived", so
# this bridge never emits it) -- mapped here to defaultStatus. Same shape as
# turtlebot_robot_sdk (Agent SDK sibling) and the Edge SDK connectors here.
#
# Scoped to the robot directly, not a tag -- WDC has no dedicated hardware
# tag like Keenon/Allybot/Autoxing do.

apiVersion: v0.1
kind: MissionTracking
metadata:
  id: all
  scope: robot/rnLasGAxn5CP7bj32/223623373
spec:
  processingType:
    - api
  autoClosePreviousMission: true
  attributes:
    mission_tracking:
      type: missionApi
  stateDefinitions:
    Executing:
      defaultStatus: OK
    Completed:
      defaultStatus: OK
    Aborted:
      defaultStatus: error
