# Global Navigation dashboard (account-level, shared by all connectors).
# Holds the common sections plus one section per vendor, each conditioned on
# that vendor's hardware tag. Each connector edits only its own section.
# The control widget action list (Preferences) is not defined here; a
# connector that needs one keeps it in its own cac/preferences.yaml.
#
# WARNING: this file is the full dashboard spec. Do not remove other vendors'
# sections when applying.
#
# Apply with:
#   sed -e "s/<ACCOUNT_ID>/your-account-id/g" \
#       account_cac/dashboard_navigation.yaml > /tmp/navigation.yaml
#   yes | inorbit apply -f /tmp/navigation.yaml

apiVersion: v0.1
kind: DashboardDefinition
metadata:
  id: d-Navigation-Z8YZAb
  scope: account/<ACCOUNT_ID>
spec:
  label: Navigation
  order: 3
  sections:
  - label: Robot Navigation
    scope: navigation
    widgets:
    - label: Navigation
      layout:
        grid: 12
        height: 2
      type: navigation
    withControlWidget: true
  - label: Details
    scope: robot
    widgets:
    - config:
        dataSources:
        - id: xlXPmDo3Z3GMwSTM
          label: Battery
          type: gauge
          unit: '%'
      label: Vitals
      layout:
        chroma: true
        grid: 4
        height: 1
      type: vitals
    - label: Audit Log
      layout:
        chroma: true
        grid: 4
        height: 1
      type: auditLog
    - label: Modes and Tags
      layout:
        chroma: true
        grid: 4
        height: 1
      type: tagsAndModes
    withControlWidget: false
  - conditional:
      tags:
      - StdZGa32GmBLReFr
    label: Allybot
    scope: robot
    widgets:
    - config:
        actionIds:
        - allybot-clean-default-area
        - allybot-pause-task
        - allybot-resume-task
        - allybot-stop-task
        bigButtons: true
        expanded: true
      label: Allybot Actions
      layout:
        chroma: true
        grid: 6
        height: 1
      type: actionsWidget
    - label: Mission
      layout:
        chroma: true
        grid: 6
        height: 1
      type: missionTracker
    withControlWidget: false
  - conditional:
      tags:
      - 8gMbOLofiZYK0uKx
    label: Autoxing
    scope: robot
    widgets:
    - config:
        actionIds:
        - autoxing-go-to-a
        - autoxing-go-to-b
        - autoxing-go-to-home
        - autoxing-go-home
        - autoxing-cancel-task
        bigButtons: true
        expanded: true
      label: Autoxing Actions
      layout:
        chroma: true
        grid: 6
        height: 1
      type: actionsWidget
    - label: Mission
      layout:
        chroma: true
        grid: 6
        height: 1
      type: missionTracker
    withControlWidget: false
  - conditional:
      tags:
      - QJoR03aXlEhZkD6N
    label: TurtleBot
    scope: robot
    widgets:
    - config:
        actionIds:
        - turtlebot-go-home
        - turtlebot-go-station-1
        - turtlebot-go-station-2
        - turtlebot-cancel-task
        - turtlebot-dispatch-demo-route
        bigButtons: true
        expanded: true
      label: TurtleBot Actions
      layout:
        chroma: true
        grid: 6
        height: 1
      type: actionsWidget
    - label: Mission
      layout:
        chroma: true
        grid: 6
        height: 1
      type: missionTracker
    withControlWidget: false
  - conditional:
      tags:
      - DJbJhivzeMvXDj8z
    label: Keenon
    scope: robot
    widgets:
    - config:
        actionIds:
        - keenon-send-to-table-1
        - keenon-send-to-table-2
        - keenon-send-to-table-3
        - keenon-return-to-origin
        - keenon-cancel-task
        - keenon-open-cabin
        - keenon-close-cabin
        - keenon-clean-recharge
        - keenon-clean-finish
        - keenon-clean-pause
        - keenon-clean-temporary-task
        bigButtons: true
        expanded: true
      label: Keenon Actions
      layout:
        chroma: true
        grid: 6
        height: 1
      type: actionsWidget
    - label: Mission
      layout:
        chroma: true
        grid: 6
        height: 1
      type: missionTracker
    withControlWidget: false
