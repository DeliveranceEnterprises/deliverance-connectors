# Cleaning-robot demo data sources for the TurtleBot.
# Scope: tag/<ACCOUNT_ID>/<TURTLEBOT_CLEANING_TAG_ID> ("TurtleBot Cleaning",
# collection "Other"). Pure demo overlay — does not affect the base TurtleBot
# tag configuration.
#
# Tank fields use scale: 1 + unit: "%" because the connector publishes them
# already as 0-100 percent values (Otto100 pattern, avoids the 2000% bug).

apiVersion: v0.1
kind: DataSourceDefinition
metadata:
  id: turtlebot-clean-water-tank
  scope: "tag/<ACCOUNT_ID>/<TURTLEBOT_CLEANING_TAG_ID>"
spec:
  label: Clean Water Tank
  scale: 0.01
  unit: "%"
  source:
    keyValue:
      key: clean_water_tank
  timeline:
    fieldType: number
---
