# DataSourceDefinition objects for the TurtleBot demo connector.
# Replace all placeholder scopes with your account/tag before applying.

apiVersion: v0.1
kind: DataSourceDefinition
metadata:
  id: turtlebot-battery
  scope: "tag/<ACCOUNT_ID>/<TURTLEBOT_TAG_ID>"
spec:
  label: Battery
  unit: "%"
  scale: 0.01
  source:
    keyValue:
      key: battery_percent
  timeline:
    fieldType: number
---
apiVersion: v0.1
kind: DataSourceDefinition
metadata:
  id: turtlebot-online-status
  scope: "tag/<ACCOUNT_ID>/<TURTLEBOT_TAG_ID>"
spec:
