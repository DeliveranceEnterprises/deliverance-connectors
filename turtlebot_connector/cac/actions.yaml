apiVersion: v0.1
kind: ActionDefinition
metadata:
  id: turtlebot-cancel-task
  scope: "robot/<ACCOUNT_ID>/<ROBOT_ID>"
spec:
  type: RunScript
  label: Cancel Task
  group: TurtleBot Demo
  description: Cancel the active fake TurtleBot navigation task.
  widgets: ["navigation"]
  confirmation:
    required: true
  lock: false
  arguments:
    - name: filename
      type: string
      value: cancel_task
