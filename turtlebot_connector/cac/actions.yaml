# ActionDefinition objects for the TurtleBot demo connector.
# Replace all placeholder scopes with your account/tag before applying.

apiVersion: v0.1
kind: ActionDefinition
metadata:
  id: turtlebot-go-home
  scope: "robot/<ACCOUNT_ID>/<ROBOT_ID>"
spec:
  type: RunScript
  label: Go Home
  group: TurtleBot Demo
  description: Send the fake TurtleBot to the home waypoint.
  widgets: ["navigation"]
  confirmation:
    required: false
  lock: false
  arguments:
    - name: filename
      type: string
      value: go_to
    - name: waypoint
      type: string
      value: home
---
