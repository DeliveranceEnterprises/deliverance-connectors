[project]
name = "turtlebot-connector"
version = "0.1.0"
description = "Demo InOrbit Edge connector for a simulated TurtleBot"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Deliverance Enterprises", email = "eduardo.munera@deliverance.enterprises" },
]
maintainers = [
    { name = "Deliverance Enterprises", email = "eduardo.munera@deliverance.enterprises" },
]
keywords = ["inorbit", "connector", "edge-connector", "robotics", "turtlebot", "simulation"]
classifiers = [
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "inorbit-connector[system-stats]~=2.2.0",
    "pydantic-settings~=2.7",
    "python-dotenv~=1.2",
]

[project.urls]
Homepage = "https://github.com/deliverance-enterprises/deliverance-connectors"
Documentation = "https://github.com/deliverance-enterprises/deliverance-connectors/tree/main/turtlebot_connector#readme"
Repository = "https://github.com/deliverance-enterprises/deliverance-connectors"
Issues = "https://github.com/deliverance-enterprises/deliverance-connectors/issues"

[project.optional-dependencies]
dev = [
    "coverage~=7.11",
    "pytest~=8.4",
    "pytest-asyncio~=1.2",
    "tox~=4.32",
    "tox-uv~=1.29",
    "colorlog~=6.10.1",
    "ruff>=0.14.7",
]

[project.scripts]
turtlebot-connector = "turtlebot_connector.turtlebot_connector:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["turtlebot_connector"]

[tool.coverage.run]
source = ["turtlebot_connector/"]

[tool.coverage.report]
fail_under = 0

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.tox]
env_list = ["py313"]

[tool.tox.gh]
python = { "3.13" = "py313" }

[tool.tox.env_run_base]
extras = ["dev"]
commands = [
    [
        "ruff",
        "check",
    ],
    [
        "coverage",
        "run",
        "-m",
        "pytest",
    ],
    [
        "coverage",
        "html",
        "-d",
        "{envlogdir}/coverage",
    ],
]
