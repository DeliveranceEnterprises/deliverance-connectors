services:
  turtlebot-connector:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../config/.env
    command: ["--config", "config/my_fleet.yaml"]
    volumes:
      - ../config:/app/config:ro
    restart: unless-stopped
